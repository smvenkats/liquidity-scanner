[build]
builder = "dockerfile"

[deploy]
startCommand = "uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# A persistent Volume must be attached to this service and mounted at /data
# (configured in the Railway UI/CLI — see directives/deploy_railway.md).
# Signals, bars, and the rotated Questrade token cache live there.
